name: Deploy Cloudflare Worker Cron (Zero-VPS)

on:
  push:
    branches: [main]
    paths:
      - 'workers/cloudflare-autopilot-cron/**'
      - '.github/workflows/deploy-cloudflare-cron.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-cloudflare-cron:
    name: Test & Deploy rtrader-autopilot-cron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Cloudflare Worker Cron Unit Gate
        run: bun test tests/batch-bo-cron-autopilot-tick-and-cf-worker.test.ts tests/batch-ej-zero-vps-cloudflare-serverless-execution.test.ts

      - name: Check Cloudflare Deployment Secrets
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped Cloudflare deploy: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets to enable automatic cloud deployments."
          fi

      - name: Deploy rtrader-autopilot-cron via Wrangler Action
        if: steps.cf_check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cloudflare-autopilot-cron
          command: deploy
