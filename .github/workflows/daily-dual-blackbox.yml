name: Daily Dual-Environment Live Blackbox & UI Health

on:
  schedule:
    # Runs daily at 03:00 UTC (10:00 WIB)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-blackbox:
    name: Live API Blackbox (168) + CEX UI Smoke (16) + Testnet E2E (52)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dual-environment API blackbox & CEX UI smoke suite (verify:live:all)
        run: bun run verify:live:all

      - name: Run 8-stage full-usecase Testnet E2E simulation (verify:testnet:e2e)
        run: bun run verify:testnet:e2e
