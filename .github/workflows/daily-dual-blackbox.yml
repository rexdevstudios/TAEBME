name: Daily Dual-Environment Live Blackbox Health

on:
  schedule:
    # Runs daily at 03:00 UTC (10:00 WIB)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  dual-blackbox:
    name: Live Blackbox Audit (Testnet + Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dual-environment blackbox suite
        run: bun run verify:blackbox:dual
