name: Verify Control Plane & Modular Suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Unit, Whitebox & Simulation Gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_ENV: test
      BYTEDANCE_ARK_API_KEY: mock_ci_ark
      GEMINI_API_KEY: mock_ci_gemini
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unified verification gate (verify:all)
        run: bun run verify:all
